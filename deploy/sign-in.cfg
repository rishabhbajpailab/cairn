# Cairn's sign-in (oauth2-proxy), in front of everything Cairn serves (ADR 0015).
# Cairn's own GitHub OAuth App, separate from EoC's. Settings that are not secret live
# here; the client ID, redirect URL and allowed account come from deploy/sign-in.env,
# and the two secrets from deploy/secrets/ (all gitignored).

provider = "github"
http_address = "0.0.0.0:4180"
upstreams = ["http://cairn:8787"]

# Who may sign in is OAUTH2_PROXY_GITHUB_USERS in deploy/sign-in.env, and nobody else.
email_domains = ["*"]

client_secret_file = "/run/secrets/cairn_github_client_secret"
cookie_secret_file = "/run/secrets/cairn_cookie_secret"
cookie_name = "_cairn_oauth2"
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "720h"
skip_provider_button = true

# The web app's own requests: answered 401 when not signed in, not redirected to GitHub
# (a fetch or a WebSocket can't follow that). These match the path AND query string
# (tried: `^/hub$` missed `/hub?token=…`); skip_auth_routes below match the path only.
api_routes = ["^/api/", "^/hub(\\?|$)"]

# Machine paths, let through WITHOUT a GitHub sign-in: phones, scripts, webhooks and
# Discord can't sign in, and each of these checks its own credential in Cairn (a scoped
# token, a webhook token, Discord's signature). Keep this list exactly in sync with the
# machine routes in crates/cairn-app/src/api.rs, and as short as possible: everything
# not listed here needs the GitHub sign-in AND Cairn's token.
skip_auth_routes = [
  "POST=^/api/v1/capture$",
  "POST=^/ingest/webhook/[A-Za-z0-9_-]+$",
  "POST=^/integrations/discord/interactions$",
  "GET=^/healthz$",
]
