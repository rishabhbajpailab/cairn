[package]
name = "cairn-gateway-core"
description = "Spend-control core for the gateway Worker: caps, ledger (over a SQL trait), model selection, OpenRouter client."
version.workspace = true
edition.workspace = true
publish.workspace = true

# NOTE: must not depend on cairn-store/cairn-app or anything that can reach the main DB,
# and nothing except workers/gateway and hosts/gateway may depend on this crate (invariant 5).
[dependencies]
cairn-http.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
ulid.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
# rusqlite LedgerSql for the VPS gateway (hosts/gateway). Never enabled for wasm.
sqlite = ["dep:rusqlite"]

[dev-dependencies]
rusqlite.workspace = true
tokio.workspace = true

[lints]
workspace = true
