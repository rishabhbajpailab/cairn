# cairn-gateway caps. Committed and compiled INTO the gateway Worker at build time, so there
# is no runtime path that can change them: raising a limit means editing this file and running
# `wrangler deploy` with your Cloudflare credentials (which the app never holds).
# See docs/spend-control.md.
#
# Model slugs and prices are placeholders: verify against https://openrouter.ai/models
# before relying on them.

[global]
# Hourly GET /key check (management key? credit limit set?). Through AI Gateway this needs
# /key to be proxied with the stored key. If it isn't (verify in M1), switch to "best-effort"
# ONLY after setting the AI Gateway spend limit and the OpenRouter key limit by hand.
key_check = "required"
per_day_usd = 0.50          # UTC day, matches OpenRouter usage_daily
per_month_usd = 8.00
per_request_max_usd = 0.10
providers_only = []         # optional mirror of the account-wide provider allowlist

[breaker]
max_usd_per_hour = 0.25
max_rejections_per_10m = 20

[reconcile]
tolerance_usd = 0.05

[[allow]]
model = "anthropic/claude-haiku-4.5"
max_prompt_usd_per_m = 1.50
max_completion_usd_per_m = 6.00

[[allow]]
model = "google/gemini-2.5-flash"
max_prompt_usd_per_m = 0.50
max_completion_usd_per_m = 3.00

[plugins.triage]
per_day_usd = 0.10

[plugins.digest]
per_day_usd = 0.15
