name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Invariant 5: only the gateway talks to OpenRouter / AI Gateway.
      - name: upstream isolation
        run: |
          if grep -rIl -e "openrouter.ai" -e "gateway.ai.cloudflare.com" -e "cf-aig-authorization" crates workers hosts --include=*.rs \
             | grep -v -e "^crates/cairn-gateway-core/" -e "^workers/gateway/" -e "^hosts/gateway/"; then
            echo "LLM upstream referenced outside the gateway"; exit 1; fi
      # Invariant 5 on the VPS: only the gateway binary may link the gateway core, and it
      # must not link the store.
      - name: host isolation
        run: |
          if cargo tree -p cairn-server -e normal | grep -q cairn-gateway-core; then
            echo "cairn-server depends on cairn-gateway-core"; exit 1; fi
          if cargo tree -p cairn-gateway-server -e normal | grep -q -e cairn-store -e cairn-app; then
            echo "cairn-gateway-server can reach the main database"; exit 1; fi
      # Invariant 6: the API Worker must never bind the ledger or the key.
      - name: gateway isolation
        run: |
          if grep -n -e "LEDGER" -e "OPENROUTER" -e "CF_AIG" -e "AIG_" workers/api/wrangler.toml | grep -v "^.*#"; then
            echo "API Worker binds gateway-only resources"; exit 1; fi

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p cairn-api-worker -p cairn-gateway-worker --target wasm32-unknown-unknown
      - run: cargo install -q worker-build
      - run: cd workers/gateway && worker-build --release
      - run: cd workers/api && worker-build --release

  # The VPS images (ADR 0014). Built on every push; pushed to GHCR only by `release`, on a
  # version tag. The build layers go to the Actions cache so `release` doesn't rebuild.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: cairn
          tags: cairn:ci
          load: true
          cache-from: type=gha,scope=cairn
          cache-to: type=gha,scope=cairn,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          tags: cairn-gateway:ci
          load: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: gateway image has no cairn binary, and vice versa
        run: |
          ! docker run --rm --entrypoint sh cairn-gateway:ci -c 'test -e /usr/local/bin/cairn'
          ! docker run --rm --entrypoint sh cairn:ci -c 'test -e /usr/local/bin/cairn-gateway'
      - run: for f in cairn gateway sign-in; do cp deploy/$f.env.example deploy/$f.env; done && docker compose config -q
      - name: network boundaries (ADR 0014, 0015)
        run: |
          docker compose -f compose.yaml -f compose.eoc.yaml config --format json > merged.json
          docker compose config --format json > standalone.json
          python3 -c "
          import json
          m = json.load(open('merged.json'))['services']; s = json.load(open('standalone.json'))['services']
          net = lambda d, n: set(d[n].get('networks', {}))
          # Only the sign-in faces the door; cairn only reaches the index; the gateway no EoC network.
          assert net(m, 'cairn-sign-in') == {'default', 'eoc-door'}, net(m, 'cairn-sign-in')
          assert net(m, 'cairn') == {'default', 'gateway', 'eoc-index'}, net(m, 'cairn')
          assert net(m, 'cairn-gateway') == {'gateway', 'gateway-egress'}, net(m, 'cairn-gateway')
          # Nothing published when sharing EoC; standalone publishes only the sign-in, on loopback.
          assert not any(v.get('ports') for v in m.values()), 'published with EoC'
          pub = {n: v['ports'] for n, v in s.items() if v.get('ports')}
          assert list(pub) == ['cairn-sign-in'] and all(p['host_ip'] == '127.0.0.1' for p in pub['cairn-sign-in']), pub
          "

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile && pnpm types && pnpm check && pnpm build

  # On a tag vX.Y.Z, after every check above passes: push both images to GHCR as X.Y.Z and
  # latest, so the VPS only pulls (docs/deploy.md). Pre-release tags (v1.2.0-rc.1) get their
  # version tag but not latest.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, wasm, docker, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: tag matches the workspace version
        run: |
          want="v$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-cairn
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cairn
          tags: type=semver,pattern={{version}}
          flavor: latest=auto
      - id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cairn-gateway
          tags: type=semver,pattern={{version}}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: cairn
          push: true
          tags: ${{ steps.meta-cairn.outputs.tags }}
          labels: ${{ steps.meta-cairn.outputs.labels }}
          cache-from: type=gha,scope=cairn
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha,scope=gateway
