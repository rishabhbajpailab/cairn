# Cairn sharing the rented server with Engine of Creation (EoC), the standard
# deployment (docs/deploy.md). Start EoC first: its compose file makes the two
# networks below.
#
#   docker compose -f compose.yaml -f compose.eoc.yaml up -d --build
#   (or `make vps-up`, which does exactly that)
#
# - eoc-cairn-index: cairn ↔ EoC's `index` (SurrealDB 4.0.1). SURREAL_URL below.
# - eoc-cairn-door:  EoC's `door` (Caddy, ports 80/443) ↔ cairn. EoC's
#   deploy/sites/cairn.caddy proxies CAIRN_ADDRESS to cairn:8787.
# Only `cairn` joins them, never the gateway, and cairn never joins EoC's
# `inside` network, so it cannot reach EoC's book.
services:
  cairn:
    environment:
      SURREAL_URL: http://index:8000
    # The door reaches cairn over eoc-cairn-door, so nothing is published.
    ports: !reset []
    networks: [default, gateway, eoc-index, eoc-door]

networks:
  eoc-index:
    external: true
    name: eoc-cairn-index
  eoc-door:
    external: true
    name: eoc-cairn-door
